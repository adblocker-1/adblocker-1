name: Snake

# Erzeugt die Snake-Animation aus dem Contribution-Graph und legt sie
# im Branch "output" ab. Der Branch wird beim ersten Lauf selbst angelegt.

on:
  schedule:
    - cron: "0 3 * * *"   # jede Nacht um 03:00 UTC
  workflow_dispatch:       # von Hand startbar (Tab "Actions")
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Snake erzeugen
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#FFB7C5&color_dots=#FFF5F7,#FFDDE4,#FFB7C5,#E89AB3,#CBA6F7
            dist/snake-dark.svg?palette=github-dark&color_snake=#FFB7C5&color_dots=#2B2233,#4A3A54,#8E6E9E,#CBA6F7,#FFB7C5

      - name: In den Branch "output" schieben
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
