name: Statistikkarten

# Zeichnet assets/*.svg neu und traegt die Projektliste zwischen den
# PROJEKTE-Markern im README nach - beides aus den aktuellen GitHub-Daten.
# Committet nur, wenn sich wirklich etwas geaendert hat.

on:
  schedule:
    - cron: "20 */6 * * *"   # alle 6 Stunden
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/generate_stats.py"
      - ".github/workflows/stats.yml"

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Karten und Projektliste neu erzeugen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_stats.py

      - name: Committen, falls geaendert
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain assets README.md)" ]; then
            git add assets README.md
            git commit -m "Statistiken und Projektliste aktualisiert"
            git push
          else
            echo "Keine Aenderung - nichts zu committen."
          fi
