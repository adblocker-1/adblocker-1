<svg xmlns="http://www.w3.org/2000/svg" width="460" height="156" viewBox="0 0 460 156" role="img" aria-label="MailStore-PRTG: Archiving profiles and job status for MailStore Server.">
<title>MailStore-PRTG: Archiving profiles and job status for MailStore Server.</title>
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  .pulse { animation: pulse 2s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect x=".5" y=".5" width="459" height="155" rx="12" fill="#161b22" stroke="#30363d"/>
<rect x="24" y="20" width="50" height="22" rx="11" fill="#e16f24" fill-opacity=".14"/>
<text x="49" y="35" class="sans" font-size="11.5" font-weight="600" fill="#e16f24" text-anchor="middle" letter-spacing=".6">MAIL</text>
<circle cx="430" cy="31" r="5" fill="#3fb950" class="pulse" style="animation-delay:0.9s"/>
<text x="24" y="68" class="sans" font-size="19" font-weight="700" fill="#58a6ff">MailStore-PRTG</text>
  <text x="24" y="92" class="sans" font-size="14" fill="#8b949e">Archiving profiles and job</text>
  <text x="24" y="113" class="sans" font-size="14" fill="#8b949e">status for MailStore Server.</text>
<circle cx="30" cy="134" r="6" fill="#5391fe"/>
<text x="43" y="139" class="sans" font-size="13" fill="#8b949e">PowerShell</text>
<text x="436" y="139" class="mono" font-size="12" fill="#8b949e" text-anchor="end">PRTG sensor</text>
</svg>
