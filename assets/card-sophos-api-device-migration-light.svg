<svg xmlns="http://www.w3.org/2000/svg" width="460" height="156" viewBox="0 0 460 156" role="img" aria-label="Sophos-api-device-migration: Moves Sophos Central devices between tenants with a few clicks.">
<title>Sophos-api-device-migration: Moves Sophos Central devices between tenants with a few clicks.</title>
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  .pulse { animation: pulse 2s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect x=".5" y=".5" width="459" height="155" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<rect x="24" y="20" width="96" height="22" rx="11" fill="#bf3989" fill-opacity=".14"/>
<text x="72" y="35" class="sans" font-size="11.5" font-weight="600" fill="#bf3989" text-anchor="middle" letter-spacing=".6">ADMIN TOOL</text>
<circle cx="430" cy="31" r="5" fill="#1a7f37" class="pulse" style="animation-delay:2.4s"/>
<text x="24" y="68" class="sans" font-size="19" font-weight="700" fill="#0969da">Sophos-api-device-migration</text>
  <text x="24" y="92" class="sans" font-size="14" fill="#59636e">Moves Sophos Central devices</text>
  <text x="24" y="113" class="sans" font-size="14" fill="#59636e">between tenants with a few clicks.</text>
<circle cx="30" cy="134" r="6" fill="#5391fe"/>
<text x="43" y="139" class="sans" font-size="13" fill="#59636e">PowerShell</text>
<text x="436" y="139" class="mono" font-size="12" fill="#59636e" text-anchor="end">GUI tool</text>
</svg>
