<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Hi, I'm Adblocker: Systems Engineer, Monitoring, PowerShell Automation">
<title>Hi, I'm Adblocker: Systems Engineer, Monitoring, PowerShell Automation</title>
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  .pulse { animation: pulse 2s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  .ecg { stroke-dasharray: 380 1200; animation: ecg 3.2s linear infinite; }
  @keyframes ecg { from { stroke-dashoffset: 1200; } to { stroke-dashoffset: -380; } }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#111d2e"/>
  </linearGradient>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#3fb950"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#1f2a37" stroke-width="1"/>
  </pattern>
  <clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
</defs>
<g clip-path="url(#frame)">
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)" opacity=".6"/>
</g>
<rect x=".5" y=".5" width="1199" height="319" rx="18" fill="none" stroke="#30363d"/>

<rect x="64" y="52" width="250" height="30" rx="15" fill="#1c2431" stroke="#30363d"/>
<circle cx="84" cy="67" r="5" fill="#3fb950" class="pulse"/>
<text x="98" y="72" class="mono" font-size="12" fill="#3fb950" letter-spacing="1.5" font-weight="600">ALL SYSTEMS OPERATIONAL</text>

<text x="62" y="152" class="sans" font-size="58" font-weight="700" fill="#e6edf3">Hi, I'm <tspan fill="url(#name)">Adblocker</tspan></text>
<text x="64" y="196" class="sans" font-size="22" fill="#8b949e">Systems Engineer  ·  Monitoring  ·  PowerShell Automation</text>

  <rect x="64" y="226" width="137" height="34" rx="17" fill="#1c2431" stroke="#30363d"/>
  <text x="132" y="248" class="mono" font-size="14" fill="#e6edf3" text-anchor="middle">8 PRTG sensors</text>
  <rect x="212.79999999999998" y="226" width="129" height="34" rx="17" fill="#1c2431" stroke="#30363d"/>
  <text x="277" y="248" class="mono" font-size="14" fill="#e6edf3" text-anchor="middle">2 admin tools</text>
  <rect x="353.4" y="226" width="129" height="34" rx="17" fill="#1c2431" stroke="#30363d"/>
  <text x="418" y="248" class="mono" font-size="14" fill="#e6edf3" text-anchor="middle">1 Linux suite</text>

<rect x="790" y="46" width="350" height="228" rx="14" fill="#161b22" stroke="#30363d"/>
<circle cx="812" cy="68" r="5" fill="#ff5f57"/>
<circle cx="828" cy="68" r="5" fill="#febc2e"/>
<circle cx="844" cy="68" r="5" fill="#28c840"/>
<text x="1120" y="73" class="mono" font-size="12" fill="#8b949e" text-anchor="end">prtg://uptime</text>
<line x1="790" y1="88" x2="1140" y2="88" stroke="#30363d"/>
<polyline points="810,134 850,134 860,124 868,134 876,134 884,160 894,82 904,148 912,134 950,134 950,134 990,134 1000,124 1008,134 1016,134 1024,160 1034,82 1044,148 1052,134 1090,134 1090,134" fill="none" stroke="#1f2a37" stroke-width="2.5" stroke-linejoin="round"/>
<polyline points="810,134 850,134 860,124 868,134 876,134 884,160 894,82 904,148 912,134 950,134 950,134 990,134 1000,124 1008,134 1016,134 1024,160 1034,82 1044,148 1052,134 1090,134 1090,134" fill="none" stroke="#3fb950" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" class="ecg"/>
<line x1="810" y1="166" x2="1120" y2="166" stroke="#30363d" stroke-dasharray="3 4"/>

  <circle cx="816" cy="192" r="4" fill="#3fb950" class="pulse" style="animation-delay:0.0s"/>
  <text x="830" y="196" class="mono" font-size="13" fill="#8b949e">Backup jobs</text>
  <text x="1120" y="196" class="mono" font-size="13" fill="#3fb950" text-anchor="end" font-weight="600">OK</text>
  <circle cx="816" cy="217" r="4" fill="#3fb950" class="pulse" style="animation-delay:0.4s"/>
  <text x="830" y="221" class="mono" font-size="13" fill="#8b949e">Firewalls</text>
  <text x="1120" y="221" class="mono" font-size="13" fill="#3fb950" text-anchor="end" font-weight="600">OK</text>
  <circle cx="816" cy="242" r="4" fill="#3fb950" class="pulse" style="animation-delay:0.8s"/>
  <text x="830" y="246" class="mono" font-size="13" fill="#8b949e">Replication</text>
  <text x="1120" y="246" class="mono" font-size="13" fill="#3fb950" text-anchor="end" font-weight="600">OK</text>
</svg>
